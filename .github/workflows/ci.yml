name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Every PR gets CI, including stacked PRs whose base is another branch.
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install xmllint (XSD conformance suite)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils

      - name: Install poppler-utils (codes.json freshness check)
        run: sudo apt-get install -y -qq poppler-utils

      - name: Verify source and installed consumers
        run: pnpm verify

      - name: Audit production dependencies (fail on high/critical)
        run: pnpm audit --prod --audit-level high

  packages:
    name: Packed ESM & MCP (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install poppler-utils (codes.json freshness check)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: pnpm build
      - run: pnpm test:packages
      - run: pnpm test:scripts
