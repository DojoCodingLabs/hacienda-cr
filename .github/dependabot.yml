version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      security-and-runtime:
        dependency-type: production
      dev-tooling:
        dependency-type: development
    ignore:
      # TypeScript 7 (native compiler) has no compiler API yet: tsup's
      # rollup-plugin-dts and typescript-eslint 8 both refuse it. Revisit when
      # both support TS 7.
      - dependency-name: typescript
        versions: [">=7"]
      # Keep Node type definitions on the 22 line, matching the published
      # packages' `node: >=22` engines and the .nvmrc runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # xml-core@3 (via xadesjs/xmldsigjs 3) peers on xpath ^0.0.34 || ^0.0.35.
      # Revisit when xml-core widens that range.
      - dependency-name: xpath
        versions: [">=0.0.36"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
